name: Autoanosis AI Backend Release Candidate

on:
  push:
    branches:
      - "feature/ai-grounding-provenance-v1"
  pull_request:
    branches:
      - "hardening/staging-ai-contract-v1"
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ai-release-candidate:
    runs-on: ubuntu-latest
    env:
      AUTOANOSIS_ENV: development
      AUTOANOSIS_ALLOWED_ORIGINS: https://development.autoanosis.invalid
      DATABASE_URL: sqlite:///./autoanosis_exams.db
      OPENAI_API_KEY: test-openai
      AUTOA_AI_PROXY_SECRET: test-proxy
      AUTOANOSIS_IDENTITY_SECRET: test-identity
      AUTOA_ROLE_SYNC_SECRET: test-role
      ADMIN_SECRET: test-admin

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile production-critical Python
        run: |
          python -m py_compile environment.py
          python -m py_compile identity.py
          python -m py_compile grounding.py
          python -m py_compile exams_module/db/database.py
          python -m py_compile app.py

      - name: Validate environment isolation
        run: python scripts/ci/validate_environment_contract.py

      - name: Validate grounding/privacy contract
        run: python -m unittest tests.test_grounding_manifest -v

      - name: Validate integrated AI response contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path("app.py").read_text(encoding="utf-8")
          grounding = Path("grounding.py").read_text(encoding="utf-8")

          required_app = [
              "build_grounding_manifest",
              "build_context_fact_index",
              '"grounding": grounding',
          ]
          missing = [x for x in required_app if x not in app]
          if missing:
              raise SystemExit("Missing AI response contract markers: " + repr(missing))

          required_grounding = [
              "def build_grounding_manifest",
              "def build_context_fact_index",
              '"source": "ame"',
              '"resource": "mm_medications"',
              '"resource": "mm_doses"',
              '"source": "render_exams"',
              '"source": "render_documents"',
          ]
          missing = [x for x in required_grounding if x not in grounding]
          if missing:
              raise SystemExit("Missing canonical fact-index markers: " + repr(missing))

          forbidden = [
              'autoanosis-admin-2026',
          ]
          for value in forbidden:
              if value in app:
                  raise SystemExit("Unsafe production fallback remains: " + value)

          print("AUTOANOSIS AI RELEASE CANDIDATE CONTRACT: PASS")
          PY
