services:
  - type: web
    name: autoanosis-ai-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --timeout 120 --workers 2 app:app
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0
      # ---------------------------------------------------------------------------
      # Exams Ingestion + Normalizer subsystem
      # DATABASE_URL: PostgreSQL connection string (Neon/Supabase)
      # Format: postgresql://user:pass@host/dbname?sslmode=require
      # Set this in the Render dashboard under Environment → Add Secret.
      # ---------------------------------------------------------------------------
      - key: DATABASE_URL
        sync: false
      # AUTOA_AI_PROXY_SECRET: shared HMAC secret for WP→Render server-to-server calls
      # Must match the value set in the WordPress plugin (AUTOA_AI_PROXY_SECRET constant).
      - key: AUTOA_AI_PROXY_SECRET
        sync: false
      # AUTOANOSIS_IDENTITY_SECRET: shared HMAC secret for WordPress identity token signing.
      # Must match the value set in WordPress wp-config.php (AUTOANOSIS_IDENTITY_SECRET constant).
      # CRITICAL: Without this, all /exams/ingest-from-ocr calls return HTTP 401 and no exam data is ever written.
      # Generate with: python3 -c "import secrets; print(secrets.token_hex(32))"
      - key: AUTOANOSIS_IDENTITY_SECRET
        sync: false
